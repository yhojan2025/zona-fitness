name: Deploy Angular app to GitHub Pageson:  push:    branches:      - main  workflow_dispatch:permissions:  contents: read  pages: write  id-token: writeconcurrency:  group: pages  cancel-in-progress: truejobs:  build:    runs-on: ubuntu-latest    steps:      - name: Checkout        uses: actions/checkout@v4      - name: Setup Node.js        uses: actions/setup-node@v4        with:          node-version: 22          cache: npm      - name: Install dependencies        run: npm ci      - name: Build Angular app        run: npm run build -- --base-href /zona-fitness/      - name: Add SPA route fallback        run: cp dist/frontend/browser/index.html dist/frontend/browser/404.html      - name: Upload Pages artifact        uses: actions/upload-pages-artifact@v3        with:          path: dist/frontend/browser  deploy:    environment:      name: github-pages      url: ${{ steps.deployment.outputs.page_url }}    runs-on: ubuntu-latest    needs: build    steps:      - name: Deploy to GitHub Pages        id: deployment        uses: actions/deploy-pages@v4