<a class="skip-link" href="#main-content">Saltar al contenido</a>
<header class="site-header">
  <a class="brand" routerLink="/" aria-label="Zona Fitness, inicio">
    <img class="brand-mark" src="/zona-fitness-icon.png" alt="" />
    <span class="brand-wordmark" aria-hidden="true"><strong>ZONA</strong><span>FITNESS</span></span>
  </a>
  <nav class="primary-nav" aria-label="Navegación principal">
    <a routerLink="/servicios" routerLinkActive="active" ariaCurrentWhenActive="page">Servicios</a>
    <a routerLink="/planes" routerLinkActive="active" ariaCurrentWhenActive="page">Planes</a>
    <a routerLink="/horarios" routerLinkActive="active" ariaCurrentWhenActive="page">Horarios</a>
    <a routerLink="/espacio" routerLinkActive="active" ariaCurrentWhenActive="page">El espacio</a>
    <a routerLink="/productos" routerLinkActive="active" ariaCurrentWhenActive="page">Productos</a>
  </nav>
  @if (auth.isLoggedIn()) {
    <div class="session">
      <a class="staff-link" routerLink="/tickets">Soporte</a>
      @if (auth.hasRole('admin')) {
        <a class="staff-link" routerLink="/users">Usuarios</a>
      }
      <span class="session-name">
        {{ auth.user()?.name }}
        <small class="badge {{ auth.user()?.role }}">{{ auth.user()?.role }}</small>
      </span>
      <button class="button button-small button-outline" (click)="auth.logout()">Salir</button>
    </div>
  } @else {
    <a class="button button-small button-outline header-action" routerLink="/login"
      >Acceso del equipo</a
    >
  }
</header>
<main id="main-content"><router-outlet /></main>
